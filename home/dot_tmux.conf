set -g mouse on
set -g history-limit 100000
set -g prefix C-a

# Refresh VS Code Remote environment when attaching to tmux
set -ag update-environment PATH
set -ag update-environment VSCODE_IPC_HOOK_CLI
set -ag update-environment VSCODE_CLI_AUTHORITY
set -ag update-environment VSCODE_CLIENT_COMMAND
set -ag update-environment VSCODE_CLIENT_COMMAND_CWD