name: statusline-release
on:
  push:
    tags: ['statusline-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: statusline/go.mod
      - name: Build
        working-directory: statusline
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p ../dist
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../dist/statusline-linux-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o ../dist/statusline-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../dist/statusline-windows-amd64.exe .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/statusline-linux-amd64
            dist/statusline-darwin-arm64
            dist/statusline-windows-amd64.exe
