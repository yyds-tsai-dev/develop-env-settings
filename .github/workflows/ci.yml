name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up tools
        run: tests/setup-tools.sh
      - name: bats
        # bootstrap.bats skips itself off Linux; on ubuntu it runs in the docker step below.
        env:
          DEVENV_SKIP_DOCKER: ${{ runner.os == 'Linux' && '1' || '' }}
        run: .tools/bin/bats tests/bats
      - name: docker server bootstrap
        if: runner.os == 'Linux'
        timeout-minutes: 45
        run: .tools/bin/bats -T tests/bats/bootstrap.bats
      - uses: astral-sh/setup-uv@v5
      - name: pytest
        run: |
          if [ -d tests/py ]; then
            uv run --python 3.12 --with pytest --with pyyaml --with httpx pytest tests/py -v
          else
            echo "no tests/py yet"
          fi
